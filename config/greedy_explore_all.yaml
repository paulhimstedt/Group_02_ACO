# Example: Greedy with Starting Point - EXPLORE ALL MODE
# This tries ALL markets as starting points to find the BEST route
# Slower but might find routes where you travel far initially to optimize total visits

data:
  use_demo: false
  real_markets_path: "data/real/markets.json"
  real_travel_times_path: "data/real/travel_times.json"

problem:
  num_days: 1
  stay_duration: [30]
  transfer_buffer: 5
  start_location:
    enabled: true
    latitude: 48.2082
    longitude: 16.3738
    name: "Stephansplatz Area"
    force_greedy_start: false  # EXPLORE: Try all markets to find best route

algorithm:
  type: "greedy"

greedy:
  heuristic: "hybrid"
  distance_weight: 0.4
  time_window_weight: 0.6

visualization:
  plot_route: true
  plot_gantt: true
  plot_statistics: true
  save_figures: true
  figure_format: "png"
  figure_dpi: 300

output:
  results_dir: "results"
  log_level: "INFO"
  verbose: true

performance:
  random_seed: 42
